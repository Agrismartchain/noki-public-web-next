name: Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to publish, never latest"
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "10.23.0"
  IMAGE_NAME: ghcr.io/agrismartchain/noki-public-web-next
  PACKAGE_OWNER: Agrismartchain
  PACKAGE_NAME: noki-public-web-next
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse latest tag
        run: |
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "The latest tag is forbidden."
            exit 1
          fi
          if [ "${{ inputs.image_tag }}" != "${GITHUB_SHA}" ]; then
            echo "image_tag must equal the full commit SHA being built (${GITHUB_SHA}) so the OCI revision label, the tag and the release lock agree."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: pnpm check

      - name: Verify target GHCR package is private (if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # PACKAGE_OWNER (Agrismartchain) is a personal account, not an organization --
          # packages owned by a user are read via /user/packages (authenticated as that
          # user), never /orgs/{owner}/packages.
          if ! gh api "/user/packages/container/${PACKAGE_NAME}" >/tmp/package.json 2>/tmp/package-check.err; then
            if grep -q '404' /tmp/package-check.err; then
              echo "Package ${PACKAGE_NAME} does not exist yet -- first publish will create it. GHCR packages first published via a private repository's own GITHUB_TOKEN default to private; re-verified after push below."
              exit 0
            fi
            cat /tmp/package-check.err >&2
            exit 1
          fi
          visibility="$(jq -r '.visibility' /tmp/package.json)"
          if [ "${visibility}" != "private" ]; then
            echo "Container package ${PACKAGE_NAME} already exists and is '${visibility}', not private. Refusing to push." >&2
            exit 1
          fi
          echo "Container package ${PACKAGE_NAME} already exists and is private."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Capture OCI created timestamp
        id: created
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Push image with SBOM and provenance
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.created=${{ steps.created.outputs.value }}
            org.opencontainers.image.title=noki-public-web-next
            org.opencontainers.image.description=Immutable NOKI public website runtime image.
            org.opencontainers.image.licenses=UNLICENSED
          sbom: true
          provenance: true

      - name: Print immutable digest
        run: |
          echo "Image digest: ${{ steps.push.outputs.digest }}"

      - name: Verify published package is private and anonymous pull is denied
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          visibility="$(gh api "/user/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          if [ "${visibility}" != "private" ]; then
            echo "Published package ${PACKAGE_NAME} is '${visibility}', not private." >&2
            exit 1
          fi
          echo "Published package ${PACKAGE_NAME} confirmed private."

          ref="${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
          anon_docker_config="$(mktemp -d)"
          set +e
          output="$(DOCKER_CONFIG="${anon_docker_config}" docker manifest inspect "${ref}" 2>&1)"
          status=$?
          set -e
          rm -rf "${anon_docker_config}"
          if [ "${status}" -eq 0 ]; then
            echo "Anonymous access unexpectedly succeeded for ${ref}." >&2
            exit 1
          fi
          if ! echo "${output}" | grep -Eiq 'unauthorized|authentication required|denied'; then
            echo "Unexpected anonymous failure mode for ${ref}:" >&2
            echo "${output}" >&2
            exit 1
          fi
          echo "Anonymous pull confirmed refused for ${ref}."
